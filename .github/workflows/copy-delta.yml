name: scAtlasLC Copy Delta to Upper Tiers
permissions:
  id-token: write
  contents: read

# Deltas are uploaded to the nonprod bucket (shared by dev and qa). Stage and
# prod share the prod bucket, so before a stage/prod data import the delta has
# to be copied across once. This workflow does only that copy and checks it;
# data-import.yml then reads the file from its own tier's bucket. One copy
# serves both stage and prod.
on:
  workflow_dispatch:
    inputs:
      delta_file:
        description: "Delta file name under scatlas/data/deltas/ in the nonprod bucket"
        required: true
        type: string

jobs:
  copy-delta:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # always stage: its CI role does the copy, its reviewer approves the run,
    # and its DATA_BUCKET is the prod bucket stage and prod read from
    environment: stage
    concurrency:
      group: copy-delta
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-1
      CICD_ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/power-user-github-actions-cicd
      DATA_BUCKET: ${{ vars.DATA_BUCKET }}
      DATA_SOURCE_BUCKET: ${{ vars.DATA_SOURCE_BUCKET }}
      # dispatch input reaches the shell only through env and is validated below
      DELTA_FILE: ${{ inputs.delta_file }}

    steps:
      - name: Validate inputs
        run: |
          case "$DELTA_FILE" in
            ""|.*|*[!A-Za-z0-9._-]*) echo "::error::delta_file must be a plain file name (letters, digits, . _ -): '$DELTA_FILE'"; exit 1 ;;
          esac
          test -n "$DATA_BUCKET" || { echo "::error::vars.DATA_BUCKET is not set for the stage environment"; exit 1; }
          test -n "$DATA_SOURCE_BUCKET" || { echo "::error::vars.DATA_SOURCE_BUCKET is not set for the stage environment"; exit 1; }
          test "$DATA_SOURCE_BUCKET" != "$DATA_BUCKET" || { echo "::error::DATA_SOURCE_BUCKET and DATA_BUCKET are the same bucket - nothing to copy"; exit 1; }
          echo "KEY=scatlas/data/deltas/$DELTA_FILE" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: ${{ env.CICD_ROLE_ARN }}
          role-session-name: stage-scatlaslc-copy-delta-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600

      - name: Check the source file
        run: |
          SRC_SIZE=$(aws s3api head-object --bucket "$DATA_SOURCE_BUCKET" --key "$KEY" --query ContentLength --output text) \
            || { echo "::error::s3://$DATA_SOURCE_BUCKET/$KEY not found or not readable"; exit 1; }
          echo "source: s3://$DATA_SOURCE_BUCKET/$KEY ($SRC_SIZE bytes)"
          echo "SRC_SIZE=$SRC_SIZE" >> "$GITHUB_ENV"

      - name: Copy to the prod bucket
        run: |
          DST_SIZE=$(aws s3api head-object --bucket "$DATA_BUCKET" --key "$KEY" --query ContentLength --output text 2>/dev/null || echo "")
          if [ "$DST_SIZE" = "$SRC_SIZE" ]; then
            echo "s3://$DATA_BUCKET/$KEY already present with the same size - skipping the copy"
            exit 0
          fi
          # server-side copy (multipart above 8MB); nothing passes through the runner
          aws s3 cp "s3://$DATA_SOURCE_BUCKET/$KEY" "s3://$DATA_BUCKET/$KEY" --no-progress

      - name: Verify the copy
        run: |
          # ETags differ after a multipart copy, so compare sizes
          DST_SIZE=$(aws s3api head-object --bucket "$DATA_BUCKET" --key "$KEY" --query ContentLength --output text) \
            || { echo "::error::s3://$DATA_BUCKET/$KEY not found after the copy"; exit 1; }
          echo "destination: s3://$DATA_BUCKET/$KEY ($DST_SIZE bytes)"
          test "$DST_SIZE" = "$SRC_SIZE" || { echo "::error::size mismatch: source $SRC_SIZE, destination $DST_SIZE"; exit 1; }
          echo "Copy verified. Run the data import for stage (and later prod) with delta_file=$DELTA_FILE."
